<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RippleGuard — Release Gate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    /* zinc base, single cyan accent — calibrated per dark-UI standards */
    --bg: #0a0a0b;
    --surface: #141417;
    --surface2: #1c1c21;
    --border: #27272c;
    --border2: #333339;
    --text: #ececee;
    --text2: #b4b4bc;
    --muted: #77777f;
    --accent: #22d3ee;
    --accent-dim: rgba(34,211,238,.12);
    --ok: #34d399;
    --warn: #fbbf24;
    --danger: #fb7185;
    --waived: #71717a;
    --quote: #e8c47c;
    --mono: 'IBM Plex Mono', Consolas, monospace;
    --display: 'IBM Plex Serif', Georgia, serif;
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: hidden; }
  body {
    background:
      radial-gradient(1300px 640px at 14% -12%, rgba(34,211,238,.09) 0%, transparent 58%),
      radial-gradient(1100px 620px at 104% -10%, rgba(129,140,248,.06) 0%, transparent 55%),
      radial-gradient(1000px 600px at 102% 114%, rgba(52,211,153,.05) 0%, transparent 55%),
      radial-gradient(800px 520px at -8% 110%, rgba(232,121,249,.04) 0%, transparent 55%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif;
    font-size: 14px;
    min-height: 100vh;
    position: relative;
  }
  /* Ambient texture: faint dot grid + corner vignette over the glows, under content */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: -1;
    background-image:
      radial-gradient(1600px 1000px at 50% 34%, transparent 62%, rgba(0,0,0,.32) 100%),
      radial-gradient(rgba(236,236,238,.03) 1px, transparent 1.4px);
    background-size: 100% 100%, 30px 30px;
    pointer-events: none;
  }
  /* One slow-drifting aurora blob keeps the dark canvas alive */
  body::after {
    content: '';
    position: fixed; z-index: -1;
    width: 980px; height: 980px; border-radius: 50%;
    left: -260px; top: -360px;
    background: radial-gradient(circle, rgba(34,211,238,.065) 0%, rgba(129,140,248,.03) 45%, transparent 68%);
    animation: aurora 30s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes aurora {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(46vw, 12vh) scale(1.12); }
    100% { transform: translate(18vw, 42vh) scale(.92); }
  }
  @media (prefers-reduced-motion: reduce) { body::after { animation: none; } }
  .shell { max-width: 1680px; margin: 0 auto; padding: 0 40px; }

  /* ------------------------------------------------------------ header */
  header {
    border-bottom: 1px solid var(--border);
    background: rgba(10,10,11,.85);
    backdrop-filter: blur(6px);
    position: sticky; top: 0; z-index: 20;
  }
  header::after {
    content: '';
    position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
    background: linear-gradient(90deg, transparent 2%, rgba(34,211,238,.45) 16%, rgba(34,211,238,.08) 46%, transparent 82%);
    pointer-events: none;
  }
  .header-in { display: flex; align-items: center; gap: 30px; height: 80px; }
  .wordmark { display: flex; align-items: baseline; gap: 12px; flex-shrink: 0; text-decoration: none; color: inherit; }
  .wordmark .name { font-family: var(--display); font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
  .wordmark .name span { color: var(--accent); }
  .wordmark .role { font-size: 13px; color: var(--muted); letter-spacing: .18em; text-transform: uppercase; }

  .stepper { display: flex; align-items: center; gap: 0; margin: 0 auto; }
  .step {
    display: flex; align-items: center; gap: 10px;
    background: none; border: none; color: var(--muted);
    font-family: inherit; font-size: 16px; letter-spacing: .04em;
    padding: 7px 5px; cursor: pointer;
    transition: color .2s;
  }
  .step:hover { color: var(--text2); }
  .step .n {
    width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid var(--border2);
    display: grid; place-items: center;
    font-size: 12px; font-family: var(--mono);
    transition: all .25s var(--ease);
  }
  .step.active { color: var(--text); }
  .step.active .n {
    border-color: var(--accent); color: var(--accent); background: var(--accent-dim);
    box-shadow: 0 0 16px rgba(34,211,238,.35);
  }
  .step.done .n { border-color: var(--ok); color: var(--ok); }
  .step-line { width: 52px; height: 1px; background: var(--border2); margin: 0 12px; }
  .header-end {
    margin-left: auto; flex-shrink: 0;
    display: flex; align-items: center; gap: 18px;
  }
  .how-link {
    color: var(--text2); text-decoration: none;
    font-size: 14px; letter-spacing: .04em;
    padding: 7px 2px; transition: color .2s;
  }
  .how-link:hover { color: var(--accent); }
  .mode-chip {
    flex-shrink: 0;
    font: inherit; font-size: 13px; font-weight: 700; letter-spacing: .12em;
    border: 0; border-radius: 5px; padding: 7px 15px; cursor: pointer;
    transition: transform .15s var(--ease), box-shadow .2s, filter .2s;
  }
  .mode-chip:hover { transform: translateY(-1px); filter: brightness(1.06); }
  .mode-chip.live {
    color: #083344; background: linear-gradient(180deg, #67e8f9, #22d3ee);
    box-shadow: 0 4px 14px rgba(34,211,238,.28);
  }
  .mode-chip.demo {
    color: #0a0a0b; background: linear-gradient(180deg, #fcd34d, var(--warn));
    box-shadow: 0 4px 14px rgba(251,191,36,.22);
  }

  /* ------------------------------------------------------------ stages */
  .stage { animation: stageIn .55s var(--ease) both; }
  .stage.settled { animation: none; }
  @keyframes stageIn { from { opacity: 0; transform: translateY(16px); } }

  /* ------------------------------------------------------------ intake */
  .intake {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 70px;
    align-items: center;
    min-height: calc(100vh - 140px);
    padding: 36px 0 16px;
  }
  .intake-pitch { position: relative; isolation: isolate; }
  .intake-rings {
    position: absolute; left: -110px; top: -100px;
    width: 540px; height: 540px;
    pointer-events: none; z-index: 0;
  }
  .intake-rings i {
    position: absolute; inset: 0; border-radius: 50%;
    border: 1px solid rgba(34,211,238,.09);
    animation: ringPulse 9s var(--ease) infinite;
  }
  .intake-rings i:nth-child(2) { inset: 50px; animation-delay: .7s; border-color: rgba(34,211,238,.08); }
  .intake-rings i:nth-child(3) { inset: 100px; animation-delay: 1.4s; border-color: rgba(34,211,238,.07); }
  .intake-rings i:nth-child(4) { inset: 150px; animation-delay: 2.1s; border-color: rgba(34,211,238,.05); }
  @keyframes ringPulse {
    0%, 100% { transform: scale(1); opacity: .65; }
    50% { transform: scale(1.035); opacity: 1; }
  }
  .intake-copy {
    position: relative; z-index: 1;
    width: max-content; max-width: 100%;
  }
  .intake h1 {
    font-family: var(--display);
    font-size: clamp(46px, 4.2vw, 67px);
    font-weight: 500; letter-spacing: -.03em;
    line-height: 1.14; margin: 0 0 32px;
  }
  .intake h1 span { display: block; white-space: nowrap; }
  .intake h1 .h-pay {
    margin-top: 4px;
    color: var(--accent);
    font-style: italic; font-weight: 400;
    text-shadow: 0 0 46px rgba(34,211,238,.35);
  }
  .intake .lede,
  .intake-proof {
    width: 0;
    min-width: 100%;
  }
  .intake .lede {
    color: var(--text2); line-height: 1.7;
    margin: 0; font-size: 22px;
    text-align: justify; text-wrap: pretty;
  }
  .intake-proof { display: flex; flex-direction: column; gap: 24px; margin-top: 50px; }
  .intake-proof > div {
    display: grid; grid-template-columns: 96px 1fr; gap: 16px;
    align-items: baseline; font-size: 20px; color: var(--text2); line-height: 1.45;
  }
  .intake-proof b {
    font-size: 16px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--accent); font-weight: 600; font-family: var(--mono);
  }
  .intake-proof code { font-family: var(--mono); font-size: 18px; color: var(--text); }

  .intake-inbox { display: flex; flex-direction: column; gap: 14px; width: 100%; }
  .intake-card {
    display: block; width: 100%; text-align: left;
    background:
      radial-gradient(420px 200px at 22% 0%, rgba(34,211,238,.05) 0%, transparent 62%),
      linear-gradient(180deg, #1a1a1f, var(--surface));
    border: 1px solid var(--border); border-radius: 16px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 16px 36px rgba(0,0,0,.32);
    padding: 37px 35px 30px; color: inherit; font: inherit; cursor: pointer;
    transition: border-color .2s, transform .25s var(--ease);
    animation: stageIn .55s var(--ease) both;
  }
  .intake-card:hover {
    border-color: rgba(34,211,238,.38);
    transform: translateY(-3px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.05),
      0 22px 46px rgba(0,0,0,.42),
      0 0 34px rgba(34,211,238,.1);
  }
  .intake-card:active { transform: translateY(-1px); }
  .intake-card .card-meta {
    display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 15px;
  }
  .intake-card .tid {
    font-family: var(--mono); font-size: 13px; color: var(--accent);
    border: 1px solid rgba(34,211,238,.35); background: var(--accent-dim);
    border-radius: 6px; padding: 5px 11px;
  }
  .intake-card .pill {
    font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); border: 1px solid var(--border2);
    border-radius: 6px; padding: 4px 10px;
  }
  .intake-card .pill.warn { color: var(--warn); border-color: rgba(251,191,36,.35); }
  .intake-card h2 {
    font-family: var(--display);
    font-size: clamp(26px, 1.8vw, 33px); font-weight: 500; letter-spacing: -.02em;
    line-height: 1.25; margin: 0 0 8px;
    white-space: nowrap;
  }
  .intake-card .card-sec { color: var(--text2); font-size: 18px; margin: 0 0 10px; }
  .intake-card .card-foot { font-size: 16px; color: var(--muted); }
  .intake-card .cta {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 19px; padding-top: 16px; border-top: 1px solid var(--border);
    color: var(--accent); font-weight: 500; font-size: 17px;
  }
  .intake-card .cta i { font-style: normal; transition: transform .2s var(--ease); }
  .intake-card:hover .cta i { transform: translateX(5px); }

  .intake-queue { display: flex; flex-direction: column; gap: 12px; width: 100%; }
  .intake-queue .caption {
    font-size: 12px; color: var(--warn); text-transform: uppercase;
    letter-spacing: .16em; padding: 2px 2px 0;
  }
  .queued {
    display: flex; align-items: center; gap: 15px;
    width: 100%; box-sizing: border-box;
    padding: 19px 21px;
    border: 1px solid rgba(251,191,36,.32);
    background: rgba(251,191,36,.07);
    border-radius: 12px;
  }
  .queued .tid {
    font-family: var(--mono); font-size: 13px; color: var(--warn);
    border: 1px solid rgba(251,191,36,.4); background: rgba(251,191,36,.1);
    border-radius: 5px; padding: 5px 10px; flex-shrink: 0;
  }
  .queued .q-title { font-size: 18px; color: var(--text); line-height: 1.35; }
  .queued .q-meta { font-size: 15px; color: #e8c47c; margin-top: 5px; }

  footer.quiet { justify-content: flex-end; }

  /* ---------------------------------------------------------- analysis */
  .analysis { padding: 36px 0 40px; }
  .analysis-grid {
    display: grid;
    grid-template-columns: minmax(280px, 350px) 1fr;
    gap: 32px;
    align-items: start;
  }
  .hunt-rail {
    background: linear-gradient(180deg, #18181d 0%, #121215 100%);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 26px 26px 24px;
    position: sticky; top: 96px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 16px 36px rgba(0,0,0,.32);
  }
  .hunt-rail .rail-kicker {
    font-size: 12px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 12px;
  }
  .hunt-rail .rail-id {
    font-family: var(--mono); font-size: 15px; color: var(--accent); margin-bottom: 14px;
  }
  .hunt-rail h2 {
    font-family: var(--display);
    font-size: 24px; font-weight: 500; letter-spacing: -.02em;
    line-height: 1.3; margin: 0 0 10px;
  }
  .hunt-rail .rail-sec { color: var(--text2); font-size: 15px; margin: 0 0 26px; line-height: 1.5; }
  .hunt-count {
    border-top: 1px solid var(--border); padding-top: 20px;
  }
  .hunt-count b {
    display: block; font-size: 44px; font-weight: 300;
    font-family: var(--mono); line-height: 1; color: var(--accent);
  }
  .hunt-count span {
    display: block; margin-top: 8px;
    font-size: 13px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase;
  }

  .hunt { min-width: 0; }
  .hunt-top {
    display: flex; align-items: center; gap: 18px; margin-bottom: 22px;
  }
  .hunt-top h1 {
    font-family: var(--display);
    font-size: 32px; font-weight: 500; letter-spacing: -.02em; margin: 0;
  }
  .hunt-top .a-sub { color: var(--muted); font-size: 15px; margin: 5px 0 0; }
  .replay-ctrls { margin-left: auto; display: flex; gap: 8px; flex-shrink: 0; }
  .skip {
    background: none; border: 1px solid var(--border2);
    color: var(--text2); border-radius: 7px; padding: 8px 17px;
    font-size: 14px; font-family: inherit; cursor: pointer; flex-shrink: 0;
  }
  .skip:hover { border-color: var(--muted); color: var(--text); }
  .skip[hidden] { display: none; }
  .analysis.replay-paused,
  .analysis.replay-paused * { animation-play-state: paused !important; }

  .hunt-body {
    display: grid;
    grid-template-columns: 1fr minmax(300px, 360px);
    gap: 24px;
    align-items: start;
  }
  .hunt-beats {
    background: linear-gradient(180deg, #18181d 0%, #121215 100%);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 8px 26px 12px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 16px 36px rgba(0,0,0,.32);
  }
  .hunt-step {
    display: flex; gap: 16px; padding: 20px 0;
    border-bottom: 1px solid var(--border);
    opacity: .28; transition: opacity .4s;
  }
  .hunt-step:last-child { border-bottom: none; }
  .hunt-step.on, .hunt-step.done { opacity: 1; }
  .hunt-step .a-dot {
    width: 31px; height: 31px; border-radius: 50%; flex-shrink: 0; margin-top: 1px;
    border: 1px solid var(--border2);
    display: grid; place-items: center;
    font-size: 14px; font-family: var(--mono); color: var(--muted);
    transition: all .3s var(--ease);
  }
  .hunt-step.on .a-dot { border-color: var(--accent); color: var(--accent); }
  .hunt-step.done .a-dot { border-color: var(--ok); color: var(--ok); }
  .hunt-step .a-body { flex: 1; min-width: 0; }
  .hunt-step .a-title { font-weight: 500; font-size: 17px; }
  .hunt-step .a-note { color: var(--muted); font-size: 14px; margin-top: 4px; font-family: var(--mono); }
  .scanline {
    height: 4px; border-radius: 2px; background: var(--surface2);
    margin-top: 12px; overflow: hidden; position: relative; display: none;
  }
  .hunt-step.on .scanline { display: block; }
  .scanline::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    width: 45%; animation: scan 1.1s linear infinite;
  }
  @keyframes scan { from { transform: translateX(-110%); } to { transform: translateX(310%); } }

  .agent-cards {
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 10px; margin-top: 16px;
  }
  .agent-card {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; padding: 13px 12px 11px;
    opacity: 0; transform: translateY(8px);
    transition: opacity .4s var(--ease), transform .4s var(--ease), border-color .3s;
  }
  .agent-card.show { opacity: 1; transform: none; }
  .agent-card.hunt { border-color: color-mix(in srgb, var(--ag, var(--accent)) 50%, var(--border)); }
  .agent-card.finished { border-color: color-mix(in srgb, var(--ag, var(--accent)) 45%, transparent); }
  .agent-card .ag-name {
    font-size: 12px; letter-spacing: .07em; text-transform: uppercase;
    color: var(--ag, var(--accent)); font-weight: 600;
  }
  .agent-card .ag-role {
    font-family: var(--mono); font-size: 11.5px; color: var(--muted);
    margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .agent-card .ag-count {
    margin-top: 12px; font-family: var(--mono); font-size: 24px; font-weight: 300;
    color: var(--text); line-height: 1;
  }
  .agent-card .ag-count small {
    font-size: 11.5px; color: var(--muted); display: block; margin-top: 4px; letter-spacing: .04em;
  }
  .agent-card .a-pulse {
    width: 7px; height: 7px; border-radius: 50%; background: var(--ag, var(--accent));
    display: inline-block; margin-right: 5px; vertical-align: 1px;
    animation: blink 1s ease-in-out infinite;
  }
  .agent-card.finished .a-pulse { animation: none; background: var(--ok); }
  @keyframes blink { 50% { opacity: .25; } }

  .hunt-viz {
    background:
      radial-gradient(340px 260px at 50% 26%, rgba(34,211,238,.05) 0%, transparent 65%),
      linear-gradient(180deg, #18181d 0%, #121215 100%);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 20px 20px;
    display: flex; flex-direction: column; align-items: center;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 16px 36px rgba(0,0,0,.32);
  }
  .seed-frame {
    width: min(100%, 272px); aspect-ratio: 1;
    border-radius: 50%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 46%, #1a3a42 0%, #12161a 50%, #0c0c10 100%);
  }
  .seed-map { display: block; width: 100%; height: 100%; }
  .seed-map .seed-orbit {
    fill: none; stroke: rgba(103,232,249,.42); stroke-width: 1.55;
  }
  .seed-map .seed-wave {
    fill: none; stroke: #67e8f9; stroke-width: 1.25;
    animation: seedRipple 3.2s ease-out infinite;
  }
  @keyframes seedRipple {
    0% { r: 30; opacity: .5; }
    100% { r: 152; opacity: 0; }
  }
  .seed-node { opacity: 0; }
  .seed-node.in { animation: seedPop .5s var(--ease) both; }
  .seed-legend {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 7px 16px; margin-top: 16px;
  }
  .seed-legend span {
    display: flex; align-items: center; gap: 7px;
    font-size: 12.5px; color: var(--muted); letter-spacing: .04em;
  }
  .seed-legend i { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  @keyframes seedPop {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .trap-callout {
    width: 100%;
    margin: 20px 0 0;
    padding: 15px 17px 14px;
    border: 1px solid rgba(251,113,133,.3);
    background: rgba(251,113,133,.06);
    border-radius: 12px;
    box-shadow: inset 3px 0 0 var(--danger);
    opacity: 0; transform: translateY(8px);
    transition: opacity .45s var(--ease), transform .45s var(--ease);
  }
  .trap-callout.show { opacity: 1; transform: none; }
  .trap-callout .trap-k {
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--danger); margin-bottom: 7px; font-weight: 600;
  }
  .trap-callout .trap-id { font-family: var(--mono); font-size: 14px; color: var(--text); margin-bottom: 8px; }
  .trap-callout .trap-q {
    font-family: var(--mono); font-size: 14px; color: var(--quote);
    line-height: 1.45; margin: 0;
  }
  .trap-callout .trap-file { font-size: 12px; color: var(--muted); margin-top: 8px; font-family: var(--mono); }

  /* ----------------------------------------------------------- verdict */
  .hero {
    display: flex; align-items: center; gap: 30px;
    margin-top: 18px;
    padding: 22px 28px;
    border-radius: 12px;
    border: 1px solid var(--border);
    position: relative;
  }
  .hero.blocked {
    background: linear-gradient(90deg, rgba(251,113,133,.09), transparent 52%), linear-gradient(180deg, #17171c, #121215);
    box-shadow: inset 3px 0 0 var(--danger), inset 0 1px 0 rgba(255,255,255,.04), 0 16px 36px rgba(0,0,0,.32);
  }
  .hero.ok {
    background: linear-gradient(90deg, rgba(52,211,153,.09), transparent 52%), linear-gradient(180deg, #17171c, #121215);
    box-shadow: inset 3px 0 0 var(--ok), inset 0 1px 0 rgba(255,255,255,.04), 0 16px 36px rgba(0,0,0,.32);
  }
  .hero.sim { border-style: dashed; border-color: var(--warn); }
  .verdict-block { flex-shrink: 0; }

  .map-opt {

  .map-opt input {

  .map-opt .toggle {

  .map-opt .toggle::after {

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 18px 16px; }

  .node { cursor: pointer; }
  .node > g { transform-box: fill-box; transform-origin: center; animation: nodeIn .6s var(--ease) both; }
  @keyframes nodeIn { from { opacity: 0; transform: scale(.4); } }
  .node .halo { transition: fill-opacity .18s; }

  #tooltip {

  .proof-chip {
    display: inline-flex; align-items: center; gap: 8px;

  .ev-divider {

  .whatif { margin-top: 16px; padding-top: 13px; border-top: 1px solid var(--border); }

  .coverage { padding: 12px 20px 20px; }

  .bar-row .val { font-family: var(--mono); font-size: 12px; color: var(--text2); }
  .bar-track {

    box-shadow: inset 0 1px 2px rgba(0,0,0,.45);
  }
  .bar-fill {
    height: 100%; border-radius: 3px; width: 0; transition: width 1s var(--ease) .3s;
    background-image: linear-gradient(180deg, rgba(255,255,255,.22), transparent 60%);
  }
  .coverage .sub { font-size: 11px; color: var(--muted); margin-top: 12px; line-height: 1.6; }

  .btn {
    background: var(--surface2); border: 1px solid var(--border2); color: var(--text);
    border-radius: 6px; padding: 7px 15px; font-size: 12.5px; cursor: pointer;
    font-family: inherit; transition: border-color .15s, transform .1s;

  .btn:hover:not(:disabled) { border-color: var(--muted); }
  .btn:active:not(:disabled) { transform: scale(.97); }

  .btn.primary {

  .gate-controls { display: flex; align-items: center; gap: 14px; }

  .empty-state { padding: 100px 40px; text-align: center; color: var(--muted); line-height: 2.1; }

<body>
<div id="app"></div>
<div id="tooltip"></div>
<script src="gate-state.live.js"></script>
<script src="gate-state.demo.js"></script>
<script>
(function () {
  'use strict';

  const STATUS_LABEL = { tested: 'Proven', changed: 'Changed, unproven', open: 'Open', waived: 'Waived' };
  const PALETTE = { tested: '#34d399', changed: '#fbbf24', open: '#fb7185', waived: '#71717a', fallback: '#22d3ee' };
  const stColor = (st) => PALETTE[st] || PALETTE.fallback;
  // Cool categorical hues only — status semantics own green/amber/red.
  const DOMAIN_COLORS = {
    database: '#60a5fa',
    code: '#22d3ee',
    batch: '#e879f9',
    api: '#818cf8',
    test: '#38bdf8',
    config: '#a78bfa',
    docs: '#94a3b8',
  };
  const dmColor = (d) => DOMAIN_COLORS[d] || '#94a3b8';
  const DOMAIN_LABEL = {
    database: 'Data', code: 'Code', batch: 'Batch',
    api: 'API', test: 'Test', config: 'Config', docs: 'Docs',
  };
  const RISK_R = { high: 168, medium: 214, low: 252 };
  const AGENTS = [
    { name: 'data-explorer', label: 'Data', domains: ['database'], color: '#60a5fa' },
    { name: 'code-explorer', label: 'Code', domains: ['code'], color: '#22d3ee' },
    { name: 'batch-explorer', label: 'Batch', domains: ['batch', 'config', 'docs'], color: '#e879f9' },
    { name: 'api-explorer', label: 'API', domains: ['api'], color: '#818cf8' },
    { name: 'test-explorer', label: 'Test', domains: ['test'], color: '#38bdf8' },
  ];

  const app = document.getElementById('app');
  const tooltip = document.getElementById('tooltip');
  let mode = 'live';
  let data = null;
  let stage = 'intake'; // intake | analysis | verdict
  let overrides = {};
  let selectedId = null;
  let selectedDomain = null;
  // Entrance choreography plays once per verdict visit; interaction
  // re-renders (node clicks, what-if) must not replay it.
  let verdictAnimated = false;
  let showRippleLabels = false;
  let gateOutput = null;
  let timers = [];
  let replayPaused = false;

  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const eff = (a) => overrides[a.id] || a.status;
  const simActive = () => Object.keys(overrides).length > 0;
  const resolved = (st) => st === 'tested' || st === 'waived';
  const polar = (cx, cy, r, a) => [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
  const isDemo = () => mode === 'demo';
  const certHref = () => isDemo() ? '../artifacts/certificate.example.html' : '../artifacts/certificate.html';

  function applyMode(next) {
    const live = window.RIPPLE_LIVE || window.RIPPLE_DATA || null;
    const demo = window.RIPPLE_DEMO || null;
    mode = next === 'demo' && demo ? 'demo' : 'live';
    data = mode === 'demo' ? demo : live;
    overrides = {};
    selectedDomain = null;
    gateOutput = null;
    const arts = (data && data.ledger && data.ledger.artifacts) || [];
    const open = arts.find((a) => a.status === 'open');
    selectedId = (open || arts[0] || {}).id || null;
  }

  function clearTimers() {
    for (const t of timers) {
      if (t && t.tid) clearTimeout(t.tid);
    }
    timers = [];
    replayPaused = false;
  }
  function later(fn, ms) {
    const item = { fn: fn, remaining: ms, started: Date.now(), tid: null };
    const arm = (delay) => {
      item.started = Date.now();
      item.remaining = delay;
      item.tid = setTimeout(() => {
        item.tid = null;
        const i = timers.indexOf(item);
        if (i >= 0) timers.splice(i, 1);
        fn();
      }, delay);
    };
    if (replayPaused) item.tid = null;
    else arm(ms);
    timers.push(item);
  }
  function pauseReplay() {
    if (replayPaused) return;
    replayPaused = true;
    const now = Date.now();
    timers.forEach((item) => {
      if (!item.tid) return;
      clearTimeout(item.tid);
      item.tid = null;
      item.remaining = Math.max(0, item.remaining - (now - item.started));
    });
    const root = document.querySelector('.analysis');
    if (root) root.classList.add('replay-paused');
    syncReplayButtons();
  }
  function resumeReplay() {
    if (!replayPaused) return;
    replayPaused = false;
    timers.forEach((item) => {
      if (item.tid) return;
      item.started = Date.now();
      item.tid = setTimeout(() => {
        item.tid = null;
        const i = timers.indexOf(item);
        if (i >= 0) timers.splice(i, 1);
        item.fn();
      }, item.remaining);
    });
    const root = document.querySelector('.analysis');
    if (root) root.classList.remove('replay-paused');
    syncReplayButtons();
  }
  function syncReplayButtons() {
    const pause = document.getElementById('replay-pause');
    const play = document.getElementById('replay-play');
    if (pause) pause.hidden = replayPaused;
    if (play) play.hidden = !replayPaused;
  }

    clearTimers();

    const [x0, y0] = polar(cx, cy, r, a0);

    return `M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
  }

  function countUp(el, target, ms) {
    if (!el) return;
    const t0 = performance.now();
    let hold = 0;
    let extra = 0;
    (function tick(now) {
      if (replayPaused) {
        if (!hold) hold = now;
        requestAnimationFrame(tick);
        return;
      }
      if (hold) {
        extra += now - hold;
        hold = 0;
      }
      const p = Math.min(1, (now - t0 - extra) / ms);
      el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(tick);
    })(performance.now());
  }

  function renderVerdict() {
    const ledger = data.ledger;
    const gate = data.gate || {};
    const arts = ledger.artifacts || [];
    const approved = computeApproved();
    const sim = simActive();

    const counts = { tested: 0, changed: 0, open: 0, waived: 0 };
    for (const a of arts) counts[eff(a)] = (counts[eff(a)] || 0) + 1;
    const unresolvedCount = counts.open + counts.changed;

    const W = 900, H = 620, CX = W / 2, CY = H / 2;
    const domains = [...new Set(arts.map((a) => a.domain || 'other'))];
    const nodes = [];
    const sectors = [];
    const GAP = 0.07;
    let cursor = -Math.PI / 2;
    for (const d of domains) {
      const group = arts.filter((a) => (a.domain || 'other') === d);
      const span = (group.length / arts.length) * Math.PI * 2;
      sectors.push({ domain: d, a0: cursor + GAP / 2, a1: cursor + span - GAP / 2 });
      group.forEach((a, i) => {
        const angle = cursor + span * ((i + 0.5) / group.length);
        const tier = RISK_R[a.risk] ? a.risk : 'low';
        const [x, y] = polar(CX, CY, RISK_R[tier] || RISK_R.low, angle);
        nodes.push({ a, x, y });
      });
      cursor += span;
    }

    // Risk semantics live in the legend — on-canvas ring labels collide
    // with whichever domain happens to occupy that angle.
    // Inner orbit is brightest: closest to the core = highest risk.
    const ringOpacity = [0.3, 0.2, 0.12];
    const rings = Object.values(RISK_R)
      .map((r, i) => `<circle class="ring-guide" cx="${CX}" cy="${CY}" r="${r}" stroke-opacity="${ringOpacity[i] ?? 0.12}"></circle>`)
      .join('');

    // Each sector arc splits around its label so text never crosses a line,
    // and both are tinted with the domain's categorical color.
    const R_ARC = 282;
    const domainArcs = sectors
      .map((s) => {
        const mid = (s.a0 + s.a1) / 2;
        const label = s.domain.toUpperCase();
        const halfGap = ((label.length * 8.6) / 2 + 13) / R_ARC;
        const [lx, ly] = polar(CX, CY, R_ARC, mid);
        const c = dmColor(s.domain);
        const seg = (a0, a1) =>
          a1 - a0 > 0.03 ? `<path d="${arcPath(CX, CY, R_ARC, a0, a1)}" stroke="${c}"></path>` : '';
        // Wide invisible twin path so the arc is easy to hover and click.
        const hit = `<path class="hit" d="${arcPath(CX, CY, R_ARC, s.a0, s.a1)}" stroke="${c}"></path>`;
        return `<g class="domain ${selectedDomain === s.domain ? 'active' : ''}" data-domain="${esc(s.domain)}">
          ${hit}
          ${seg(s.a0, mid - halfGap)}
          ${seg(mid + halfGap, s.a1)}
          <text x="${lx.toFixed(1)}" y="${(ly + 3.5).toFixed(1)}" fill="${c}">${esc(label)}</text>
        </g>`;
      })
      .join('');

    const spokes = nodes
      .map((n, i) => {
        const danger = !resolved(eff(n.a));
        const dx = n.x - CX, dy = n.y - CY;
        const len = Math.hypot(dx, dy) || 1;
        const ux = dx / len, uy = dy / len;
        const x1 = CX + ux * 52, y1 = CY + uy * 52;
        const x2 = n.x - ux * 27, y2 = n.y - uy * 27;
        const cls = danger ? 'danger' : 'draw';
        const delay = danger ? '' : `style="animation-delay:${(i * 35).toFixed(0)}ms"`;
        return `<line class="spoke ${cls}" pathLength="1" ${delay} x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"></line>`;
      })
      .join('');

    const glyph = { tested: '✓', open: '✕', changed: '~', waived: '–' };
    const nodeSvg = nodes
      .map((n, i) => {
        const st = eff(n.a);
        const c = stColor(st);
        const dashed = overrides[n.a.id] ? 'stroke-dasharray="5 4"' : '';
        const label = (n.a.id || '').length > 19 ? n.a.id.slice(0, 18) + '…' : n.a.id;
        return `<g class="node ${n.a.id === selectedId ? 'selected' : ''} ${st === 'open' ? 'is-open' : ''}" data-id="${esc(n.a.id)}" data-i="${i}" data-domain="${esc(n.a.domain || 'other')}">
          <g style="animation-delay:${(120 + i * 45).toFixed(0)}ms">
            <circle class="halo" cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="24" fill="${c}" fill-opacity="0.14"></circle>
            <circle class="ring" cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="16" style="fill:var(--surface)" stroke="${c}" stroke-width="2" ${dashed}></circle>
            <text x="${n.x.toFixed(1)}" y="${(n.y + 4.5).toFixed(1)}" style="fill:${c};font-size:13px;font-weight:700;text-anchor:middle">${glyph[st] || '·'}</text>
          </g>
          ${showRippleLabels ? `<text class="lbl" x="${n.x.toFixed(1)}" y="${(n.y + 37).toFixed(1)}">${esc(label)}</text>` : ''}
        </g>`;
      })
      .join('');

    const recall = gate.recall;
    const grep = gate.grep_baseline;
    const audit = gate.evidence_audit;

    app.innerHTML = `
      ${headerHtml()}
      <div class="shell stage${verdictAnimated ? ' settled' : ''}">
        <section class="hero ${approved ? 'ok' : 'blocked'} ${sim ? 'sim' : ''}">
          <div class="verdict-block">
            <div class="kicker">Release${sim ? ' · simulated' : ''}</div>
            <div class="word">${approved ? 'APPROVED' : 'BLOCKED'}</div>
            ${sim ? '<button class="exit-sim" id="sim-reset">← exit simulation</button>' : ''}
          </div>
          <div class="reason">${heroReason(arts, approved)}</div>
          <div class="hero-stats">
            <div><b class="count" data-target="${arts.length}">${verdictAnimated ? arts.length : 0}</b><span>ripples</span></div>
            <div class="${unresolvedCount ? 'bad' : 'good'}"><b class="count" data-target="${unresolvedCount}">${verdictAnimated ? unresolvedCount : 0}</b><span>unresolved</span></div>
            ${gate.tests && gate.tests.ran ? `<div class="${gate.tests.passed ? 'good' : 'bad'}"><b class="count" data-target="${gate.tests.pass_count ?? 0}">${verdictAnimated ? (gate.tests.pass_count ?? 0) : 0}</b><span>tests green</span></div>` : ''}
            ${audit ? `<div class="${audit.mismatches ? 'warn' : 'good'}"><b>${audit.verified}/${audit.total_quotes}</b><span>evidence verified</span></div>` : ''}
          </div>
        </section>

        <main class="verdict-grid">
          <div class="panel" id="map-panel">
            <div class="map-head">
              <span class="mk">Blast radius</span>
              <span class="map-chip"><b>${arts.length}</b> ripples</span>
              <span class="map-chip"><b>${domains.length}</b> domains</span>
              <span class="map-chip"><b style="color:${unresolvedCount ? 'var(--danger)' : 'var(--ok)'}">${unresolvedCount}</b> unresolved</span>
              <label class="map-opt">
                <span class="map-opt-lbl">Ripple labels</span>
                <input type="checkbox" id="ripple-labels"${showRippleLabels ? ' checked' : ''}>
                <span class="toggle" aria-hidden="true"></span>
              </label>
            </div>
            <div class="map-stage">
            <svg viewBox="0 0 ${W} ${H}" class="${verdictAnimated ? 'no-anim' : ''}">
              <defs>
                <radialGradient id="mapGlow" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#155e75" stop-opacity=".32"/>
                  <stop offset="55%" stop-color="#0e3a46" stop-opacity=".15"/>
                  <stop offset="100%" stop-color="#0e3a46" stop-opacity="0"/>
                </radialGradient>
              </defs>
              <circle cx="${CX}" cy="${CY}" r="300" fill="url(#mapGlow)"></circle>
              ${rings}
              ${spokes}
              ${domainArcs}
              <circle class="ripple-ring" cx="${CX}" cy="${CY}" r="60" stroke-width="1.3"></circle>
              <circle class="ripple-ring" cx="${CX}" cy="${CY}" r="60" stroke-width="1.3" style="animation-delay:1.8s"></circle>
              <circle class="orbit" cx="${CX}" cy="${CY}" r="54" pathLength="100"></circle>
              <circle cx="${CX}" cy="${CY}" r="46" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity=".55" stroke-width="1.25"></circle>
              <circle cx="${CX}" cy="${CY}" r="37" style="fill:var(--bg)" stroke="#22d3ee" stroke-opacity=".8" stroke-width="1.5"></circle>
              <text x="${CX}" y="${CY + 1}" text-anchor="middle" style="fill:var(--text)" font-size="13" font-weight="600">${esc(ledger.ticket_id)}</text>
              <text x="${CX}" y="${CY + 16}" text-anchor="middle" style="fill:var(--muted)" font-size="8.5" letter-spacing="1.5">TICKET</text>
              ${nodeSvg}
            </svg>
            <div class="legend">
              <div class="lg-title">Status</div>
              ${Object.entries(STATUS_LABEL).map(([k, label]) => `<span><span class="dot" style="background:${stColor(k)}"></span>${label}</span>`).join('')}
            </div>
            <div class="map-hints">
              Rings — risk · inner is highest<br>
              Arcs — domains · hover to focus, click for the dossier<br>
              Ripples — hover for the name · click to inspect
            </div>
            </div>
            <div class="gate-dock">
              <div class="gate-controls">
                <button class="btn primary" id="run-gate">Run release gate</button>
                <label><input type="checkbox" id="strict-toggle" checked> strict</label>
                <a class="btn" href="${certHref()}" target="_blank" rel="noopener">Impact certificate ↗</a>
                <span class="gate-note">Executes <code>scripts/ripple-gate.js</code> for real — hash checks, test suite, verdict.</span>
              </div>
              <div class="dock-output" id="gate-output">${
                gateOutput
                  ? esc(gateOutput)
                  : `<span class="ph">$ <b>node scripts/ripple-gate.js --strict</b> — press Run release gate to execute. Last recorded run: ${esc(gate.generated || '—')}</span>`
              }</div>
            </div>
          </div>
          <div class="side">
            <div class="panel" style="flex:1;display:flex;flex-direction:column">
              <div class="panel-title">Evidence</div>
              <div id="drawer">${drawerHtml()}</div>
            </div>
            <div class="panel">
              <div class="panel-title">Release evidence</div>
              <div class="stats">
                <div class="stat"><div class="num">${arts.length}</div><div class="lbl">Ripples found</div></div>
                <div class="stat"><div class="num" style="color:${unresolvedCount ? 'var(--danger)' : 'var(--ok)'}">${unresolvedCount}</div><div class="lbl">Unresolved</div></div>
                <div class="stat"><div class="num" style="color:var(--ok)">${counts.tested}</div><div class="lbl">Proven by tests</div></div>
                <div class="stat"><div class="num">${counts.waived}</div><div class="lbl">Waived · logged</div></div>
                ${
                  gate.tests && gate.tests.ran
                    ? `<div class="stat wide"><div class="num" style="color:${gate.tests.passed ? 'var(--ok)' : 'var(--danger)'}">${gate.tests.pass_count ?? '?'}<small> / ${(gate.tests.pass_count ?? 0) + (gate.tests.fail_count ?? 0)} tests</small></div><div class="lbl">Passing at gate time</div></div>`
                    : ''
                }
                ${
                  audit
                    ? `<div class="stat wide"><div class="num" style="color:${audit.mismatches ? 'var(--warn)' : 'var(--ok)'}">${audit.verified}<small> / ${audit.total_quotes} quotes</small></div><div class="lbl">${audit.mismatches ? 'Evidence audit — one truncated cite caught, not a gate failure' : 'Evidence verified verbatim against source'}</div></div>`
                    : ''
                }
                ${
                  recall
                    ? `<div class="stat wide">
                        <div class="lbl" style="margin:0 0 4px">Coverage of ${recall.total_impacted} known-impacted artifacts</div>
                        <div class="bar-row"><div class="name">grep</div><div class="bar-track"><div class="bar-fill" data-w="${grep ? (grep.found / grep.total) * 100 : 0}" style="background-color:var(--warn)"></div></div><div class="val">${grep ? `${grep.found}/${grep.total}` : '—'}</div></div>
                        <div class="bar-row"><div class="name">RippleGuard</div><div class="bar-track"><div class="bar-fill" data-w="${(recall.ledger_found / recall.total_impacted) * 100}" style="background-color:var(--accent)"></div></div><div class="val">${recall.ledger_found}/${recall.total_impacted}</div></div>
                      </div>`
                    : ''
                }
              </div>
            </div>
          </div>
        </main>
      </div>
      ${footerHtml()}`;

    bindShell();
    bindVerdict(nodes);
  }

  function mountVerdictAnimations() {
    if (verdictAnimated) {
      // Interaction re-render: settle everything instantly, no replay.
      document.querySelectorAll('.count[data-target]').forEach((el) => {
        el.textContent = el.dataset.target;
      });
      document.querySelectorAll('.bar-fill[data-w]').forEach((el) => {
        el.style.transition = 'none';
        el.style.width = el.dataset.w + '%';
      });
      return;
    }
    verdictAnimated = true;
    document.querySelectorAll('.count[data-target]').forEach((el) => {
      countUp(el, Number(el.dataset.target), 750);
    });
    requestAnimationFrame(() => {
      document.querySelectorAll('.bar-fill[data-w]').forEach((el) => {
        el.style.width = el.dataset.w + '%';
      });
    });
  }

  function domainDrawerHtml() {
    const arts = (data.ledger.artifacts || []).filter((a) => (a.domain || 'other') === selectedDomain);
    const c = dmColor(selectedDomain);
    const counts = {};
    for (const a of arts) counts[eff(a)] = (counts[eff(a)] || 0) + 1;
    const glyph = { tested: '✓', open: '✕', changed: '~', waived: '–' };
    return `
      <h3 style="color:${c}">${esc(selectedDomain.toUpperCase())}</h3>
      <div class="tags">
        <span class="tag" style="background:${c}1f;color:${c};border:1px solid ${c}66">${arts.length} RIPPLES</span>
        ${Object.entries(counts)
          .map(([st, n]) => `<span class="tag" style="background:var(--surface2);color:${stColor(st)}">${n} ${st}</span>`)
          .join('')}
      </div>
      <div class="ev-divider">Artifacts in this domain</div>
      ${arts
        .map((a) => {
          const st = eff(a);
          return `<button class="ticket" style="padding:12px 8px" data-pick="${esc(a.id)}">
            <span style="color:${stColor(st)};font-family:var(--mono);font-weight:700">${glyph[st] || '·'}</span>
            <span class="t-body">
              <span class="t-title" style="font-size:13px">${esc(a.id)}</span>
              <span class="t-meta">${st} · risk ${esc(a.risk)}</span>
            </span>
            <span class="t-go">→</span>
          </button>`;
        })
        .join('')}`;
  }

  function drawerHtml() {
    if (!selectedId && selectedDomain) return domainDrawerHtml();
    const a = (data.ledger.artifacts || []).find((x) => x.id === selectedId);
    if (!a) return `<div class="hint">Select a node — or a domain arc — to see why it is in the blast radius, with line-level evidence quoted from source.<br>Use the what-if control to simulate and watch the verdict react.</div>`;
    const st = eff(a);
    const c = stColor(st);
    return `
      <h3>${esc(a.id)}</h3>
      <div class="path">${esc(a.path)}</div>
      <div class="tags">
        <span class="tag" style="background:${c}1f;color:${c};border:1px solid ${c}66">${st.toUpperCase()}${overrides[a.id] ? ' · SIMULATED' : ''}</span>
        <span class="tag" style="background:var(--surface2);color:var(--text2)">risk ${esc(a.risk)}</span>
        <span class="tag" style="background:var(--surface2);color:var(--text2)">${esc(a.domain || '')}</span>
      </div>
      <div class="why">${esc(a.why)}</div>
      ${a.status === 'waived' && a.waiver_reason ? `<div class="why" style="color:var(--muted)">Waiver: ${esc(a.waiver_reason)}</div>` : ''}
      ${a.test ? `<div class="proof-chip"><span class="k">Proof</span>${esc(a.test)}</div>` : ''}
      ${(a.evidence || []).length ? `<div class="ev-divider">Cited source lines · ${(a.evidence || []).length}</div>` : ''}
      ${(a.evidence || [])
        .map((e) => {
          const parts = String(e.file).split('/');
          const base = parts.pop();
          const dir = parts.join('/') + '/';
          return `<div class="evidence">
            <div class="ev-head"><span class="ev-file">${esc(base)}</span><span class="ev-dir">${esc(dir)}</span><span class="ev-line">L${esc(e.line)}</span></div>
            <code class="quote">${esc(e.quote)}</code>
          </div>`;
        })
        .join('')}
      ${whatifHtml(a)}`;
  }

  function whatifHtml(a) {
    const isResolved = resolved(eff(a));
    return `
      <div class="whatif">
        <div class="q">${isResolved ? 'What if this ripple were left unresolved?' : 'What if this ripple were resolved?'}</div>
        <button class="btn ${overrides[a.id] ? 'active' : ''}" data-whatif="${isResolved ? 'open' : 'tested'}">${isResolved ? 'Simulate unresolved' : 'Simulate resolved'}</button>
        <button class="btn" data-whatif="clear" ${overrides[a.id] ? '' : 'disabled'}>Clear</button>
      </div>`;
  }

  // ============================================================== events
  function bindShell() {
    document.querySelectorAll('[data-goto]').forEach((el) => {
      el.addEventListener('click', () => {
        const target = el.dataset.goto;
        if (!data || !data.ledger) return;
        if (target !== stage) setStage(target);
      });
    });
    const toggle = document.querySelector('[data-mode-toggle]');
    if (toggle) {
      toggle.addEventListener('click', () => {
        applyMode(isDemo() ? 'live' : 'demo');
        if (stage === 'analysis') setStage('analysis');
        else if (stage === 'verdict') {
          verdictAnimated = false;
          render();
          mountVerdictAnimations();
        } else {
          render();
        }
      });
    }
  }

  function showTooltip(a, x, y) {
    const st = eff(a);
    let why = a.why;
    if (why.length > 110) { why = why.slice(0, 110); why = why.slice(0, why.lastIndexOf(' ')) + ' …'; }
    tooltip.innerHTML = `
      <div class="tt-id" style="color:${stColor(st)}">${esc(a.id)}</div>
      <div class="tt-why">${esc(why)}</div>
      <div class="tt-meta">${st} · risk ${esc(a.risk)} · ${esc(a.domain || '')}</div>`;
    const pad = 16;
    const tw = 300;
    const left = Math.min(x + pad, window.innerWidth - tw - 20);
    tooltip.style.left = left + 'px';
    tooltip.style.top = y + pad + 'px';
    tooltip.classList.add('show');
  }
  function hideTooltip() { tooltip.classList.remove('show'); }

  function bindVerdict(nodes) {
    document.querySelectorAll('.node').forEach((el) => {
      const a = nodes[Number(el.dataset.i)].a;
      el.addEventListener('click', () => {
        selectedId = a.id;
        selectedDomain = null;
        hideTooltip();
        paintSelection();
      });
      el.addEventListener('mousemove', (ev) => showTooltip(a, ev.clientX, ev.clientY));
      el.addEventListener('mouseleave', hideTooltip);
    });

    // Domain arcs: hover spotlights that domain's nodes; click opens the
    // domain dossier in the evidence drawer.
    document.querySelectorAll('.domain').forEach((el) => {
      const d = el.dataset.domain;
      el.addEventListener('mouseenter', () => {
        document.querySelectorAll('.node').forEach((n) => {
          if (n.dataset.domain !== d) n.classList.add('dimmed');
        });
      });
      el.addEventListener('mouseleave', () => {
        document.querySelectorAll('.node.dimmed').forEach((n) => n.classList.remove('dimmed'));
      });
      el.addEventListener('click', () => {
        selectedDomain = d;
        selectedId = null;
        hideTooltip();
        paintSelection();
      });
    });

    bindDrawer();
    bindVerdictControls();
  }

  function paintSelection() {
    document.querySelectorAll('.node').forEach((n) => {
      n.classList.toggle('selected', !!selectedId && n.dataset.id === selectedId);
    });
    document.querySelectorAll('.domain').forEach((d) => {
      d.classList.toggle('active', !!selectedDomain && d.dataset.domain === selectedDomain);
    });
    const drawer = document.getElementById('drawer');
    if (!drawer) return;
    drawer.classList.add('swap');
    window.setTimeout(() => {
      drawer.innerHTML = drawerHtml();
      drawer.classList.remove('swap');
      bindDrawer();
    }, 120);
  }

  function bindDrawer() {
    document.querySelectorAll('[data-pick]').forEach((el) => {
      el.addEventListener('click', () => {
        selectedId = el.dataset.pick;
        selectedDomain = null;
        paintSelection();
      });
    });

    document.querySelectorAll('[data-whatif]').forEach((el) => {
      el.addEventListener('click', () => {
        const a = data.ledger.artifacts.find((x) => x.id === selectedId);
        if (!a) return;
        if (el.dataset.whatif === 'clear') delete overrides[a.id];
        else overrides[a.id] = el.dataset.whatif;
        render();
        mountVerdictAnimations();
      });
    });

    document.querySelectorAll('.evidence').forEach((el) => {
      el.addEventListener('mouseenter', () => {
        const node = document.querySelector(`.node[data-id="${CSS.escape(selectedId || '')}"]`);
        if (node) node.classList.add('linked');
      });
      el.addEventListener('mouseleave', () => {
        document.querySelectorAll('.node.linked').forEach((n) => n.classList.remove('linked'));
      });
    });
  }

  function syncRippleLabels() {
    const NS = 'http://www.w3.org/2000/svg';
    document.querySelectorAll('.node').forEach((g) => {
      const existing = g.querySelector('text.lbl');
      if (!showRippleLabels) {
        if (existing) existing.remove();
        return;
      }
      if (existing) return;
      const id = g.dataset.id || '';
      const label = id.length > 19 ? id.slice(0, 18) + '…' : id;
      const ring = g.querySelector('circle.ring');
      if (!ring) return;
      const text = document.createElementNS(NS, 'text');
      text.setAttribute('class', 'lbl');
      text.setAttribute('x', ring.getAttribute('cx'));
      text.setAttribute('y', (Number(ring.getAttribute('cy')) + 37).toFixed(1));
      text.textContent = label;
      g.appendChild(text);
    });
  }

  function bindVerdictControls() {
    const labels = document.getElementById('ripple-labels');
    if (labels) {
      labels.addEventListener('change', () => {
        showRippleLabels = labels.checked;
        syncRippleLabels();
      });
    }
    const reset = document.getElementById('sim-reset');
    if (reset) reset.addEventListener('click', () => { overrides = {}; render(); mountVerdictAnimations(); });

    const runBtn = document.getElementById('run-gate');
    if (runBtn) {
      runBtn.addEventListener('click', async () => {
        runBtn.disabled = true;
        runBtn.textContent = 'Running gate…';
        try {
          if (isDemo()) {
            gateOutput = window.RECORDED_GATE_DEMO || '(no recorded demo run)';
          } else {
            const strict = document.getElementById('strict-toggle').checked;
            const res = await fetch('/api/run-gate', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ strict }),
            });
            const body = await res.json();
            gateOutput = body.output || window.RECORDED_GATE_LIVE || '(no output)';
          }
          overrides = {};
          verdictAnimated = false;
        } catch (err) {
          const recorded = isDemo() ? window.RECORDED_GATE_DEMO : window.RECORDED_GATE_LIVE;
          gateOutput = recorded
            ? recorded
            : 'Gate execution failed: ' + err.message +
              '\n(The Run button requires the bundled server: node scripts/serve.js)';
        }
        render();
        mountVerdictAnimations();
      });
    }
  }

  async function refreshData() {
    const res = await fetch('/ui/gate-state.js?ts=' + Date.now());
    const text = await res.text();
    const start = text.indexOf('{');
    const end = text.lastIndexOf('}');
    if (start >= 0 && end > start) data = JSON.parse(text.slice(start, end + 1));
  }

  function render() {
    app.classList.remove('page-zoom');
    if (!data || !data.ledger) { renderIntake(); return; }
    if (stage === 'intake') renderIntake();
    else if (stage === 'analysis') renderAnalysis();
    else renderVerdict();
  }

  applyMode('live');
  render();
})();
</script>
</body>
</html>
